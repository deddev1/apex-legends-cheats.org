# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "apexlegendscheats-org"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
[build]
command = "npm run build"

# Recreate DNS/SSL for apex + www (fixes NXDOMAIN / Google HTTP 522).
[[routes]]
pattern = "apexlegendscheats.org"
custom_domain = true

[[routes]]
pattern = "www.apexlegendscheats.org"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Host redirects need the Worker, but sitemap/robots must stay asset-first
# so Google never hits a Worker/origin timeout (HTTP 522).
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
